<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brechó</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--fg:#2a2420;--mut:#7a6e65;--card:#fff;--bd:#e6ddd2;--ac:#b4472f;--acf:#fff;--ok:#2f7d55;--wr:#a8741a;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1714;--fg:#f1e9e0;--mut:#a89c91;--card:#26211d;--bd:#3a332d;--ac:#e0735a;--acf:#1b1714;--ok:#58b583;--wr:#e0aa4f;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:22px 0 8px}
.mut{color:var(--mut);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;text-decoration:none;display:inline-block}
.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{padding:5px 12px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--bd);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.cb button{margin-top:auto;width:100%}
.tag{font-size:.78rem;font-weight:600}
.s-disponivel{color:var(--ok)}.s-reservada{color:var(--wr)}.s-vendida{color:var(--mut)}.sold{opacity:.55}
.banner{background:var(--card);border:1px solid var(--wr);border-radius:12px;padding:10px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.md{background:var(--bg);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:92vh;overflow:auto}
label{display:block;font-size:.88rem;margin:10px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg)}
textarea{height:84px;font-size:.75rem;word-break:break-all}
.row{display:flex;gap:8px}.row>*{flex:1}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
</style>
</head>
<body>
<main id="app">Carregando…</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// 1) Cole aqui os dados do seu projeto Supabase (Settings > API). A chave "anon" é pública por design.
const SUPABASE_URL='https://qholdxotfxthjscycfzy.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFob2xkeG90Znh0aGpzY3ljZnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MjczNzAsImV4cCI6MjEwOTUwMzM3MH0.rrHS7wtsoy0eOzzU1cNUoL4yy5AuPL-CZEkKDqMvqbQ';
// 2) Usuário do bot do Telegram que envia os avisos, sem o @ (veja o LEIA-ME).

const CONTATO='vitrini.brechoapp@gmail.com';
const pag=new URLSearchParams(location.search).get('p');
const RODAPE=`<p class="mut" style="margin-top:32px"><a href="?p=termos">Termos de uso</a> · <a href="?p=privacidade">Política de privacidade</a></p>`;
function paginaView(){const v=`<p><a href="${location.pathname}">Voltar</a></p>`;
if(pag==='termos')return `<h1>Termos de uso</h1><p>Este serviço é uma ferramenta de vitrine e reserva para brechós. A venda acontece entre o brechó e a cliente.</p><h2>Reserva</h2><p>Ao reservar, a peça fica separada pelo tempo definido pelo brechó. Sem pagamento dentro do prazo, ela volta para a vitrine.</p><h2>Pagamento</h2><p>O pagamento é feito por Pix direto para a chave do brechó. Nós não recebemos nem guardamos dinheiro.</p><h2>Responsabilidades</h2><p>Preço, estado das peças, entrega, trocas e devoluções são de responsabilidade do brechó. Combine tudo diretamente com ele.</p><h2>Uso do serviço</h2><p>Não use o serviço para fraude ou conteúdo ilegal. Contas que descumprirem estes termos podem ser suspensas.</p><h2>Contato</h2><p>${esc(CONTATO)}</p>${v}`;
return `<h1>Política de privacidade</h1><h2>Dados da compradora</h2><p>Nome e WhatsApp, informados ao reservar. Usamos apenas para registrar a reserva e permitir que o brechó entre em contato com você.</p><h2>Dados do dono do brechó</h2><p>E-mail, senha (armazenada de forma protegida) e os dados da loja.</p><h2>Quem recebe os dados</h2><p>O brechó da reserva e o provedor de infraestrutura que hospeda o banco de dados.</p><h2>Por quanto tempo guardamos</h2><p>Enquanto a loja existir ou até você pedir a exclusão.</p><h2>Seus direitos (LGPD)</h2><p>Você pode pedir acesso, correção ou exclusão dos seus dados pelo contato abaixo.</p><h2>Contato</h2><p>${esc(CONTATO)}</p>${v}`}
const resumo=()=>{const c=x=>S.pecas.filter(p=>p.status===x),at=S.pedidos.filter(o=>o.status==='ativo').length,tot=c('vendida').reduce((a,p)=>a+Number(p.preco),0);
return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin:16px 0">${[['Disponíveis',c('disponivel').length],['Reservadas',c('reservada').length],['Vendidas',c('vendida').length],['Total vendido',R(tot)],['Aguardando pagamento',at]].map(([t,v])=>`<div class="box" style="display:block;margin:0"><div class="mut">${t}</div><b style="font-size:1.3rem">${v}</b></div>`).join('')}</div>`};

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'R$ '+Number(n).toFixed(2).replace('.',',');
const LBL={disponivel:'Disponível',reservada:'Reservada',vendida:'Vendida'};
const slug=new URLSearchParams(location.search).get('b');
let db,S={b:null,pecas:[],pedidos:[],user:null,filtro:'Todos',modal:null,meu:null},tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3000)}
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function tlv(i,v){return i+String(v.length).padStart(2,'0')+v}
function crc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pix(chave,valor,nome,cidade){const cl=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase();
const p=tlv('00','01')+tlv('26',tlv('00','br.gov.bcb.pix')+tlv('01',chave))+tlv('52','0000')+tlv('53','986')+tlv('54',Number(valor).toFixed(2))+tlv('58','BR')+tlv('59',cl(nome).slice(0,25)||'BRECHO')+tlv('60',cl(cidade).slice(0,15)||'BRASIL')+tlv('62',tlv('05','***'))+'6304';return p+crc(p)}
function comprimir(f,mx=900){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.8)};i.onerror=()=>r(null);i.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)})}
const saveMeu=()=>{try{localStorage.setItem('pedido:'+slug,JSON.stringify(S.meu))}catch(e){}};

async function checkMeu(){if(!S.meu)return;const {data}=await db.rpc('status_pedido',{p_id:S.meu.id});if(data){S.meu.status=data.status;S.meu.expira_em=data.expira_em;saveMeu()}}
async function loadLoja(){const {data:b}=await db.from('brechos').select('*').eq('slug',slug).maybeSingle();S.b=b;if(!b)return;await db.rpc('liberar_expiradas');const {data}=await db.from('pecas').select('*').eq('brecho_id',b.id).order('criado_em',{ascending:false});S.pecas=data||[];try{S.meu=JSON.parse(localStorage.getItem('pedido:'+slug))}catch(e){}await checkMeu()}
async function loadPainel(){const {data:{session}}=await db.auth.getSession();S.user=session?session.user:null;if(!S.user)return;const {data:b}=await db.from('brechos').select('*').eq('owner',S.user.id).maybeSingle();S.b=b;if(!b)return;await db.rpc('liberar_expiradas');const [p,o]=await Promise.all([db.from('pecas').select('*').eq('brecho_id',b.id).order('criado_em',{ascending:false}),db.from('pedidos').select('*, pecas(titulo,preco)').eq('brecho_id',b.id).order('criado_em',{ascending:false})]);S.pecas=p.data||[];S.pedidos=o.data||[];const a=await db.from('avisos').select('telegram_chat_id').eq('brecho_id',b.id).maybeSingle();S.chat=a.data?a.data.telegram_chat_id:''}
async function refresh(){if(pag){render();return}if(slug)await loadLoja();else{await loadPainel();avisoPainel()}render()}

const CATS=[['Vestidos','👗'],['Blusas','👚'],['Calças e saias','👖'],['Casacos','🧥'],['Bolsas','👜'],['Calçados','👟'],['Acessórios','💍'],['Outros','🛍️']];
function favs(){try{return JSON.parse(localStorage.getItem('fav:'+slug))||[]}catch(e){return[]}}
function faixaOk(x){const f=S.faixa||'todas';x=Number(x);if(f==='todas')return true;if(f==='200+')return x>=200;const [a,b]=f.split('-').map(Number);return x>=a&&x<b}
function filtrar(){const q=(S.q||'').toLowerCase(),cat=S.cat||'Todas',f=favs();let l=S.pecas.filter(p=>(cat==='Todas'||p.categoria===cat)&&(S.filtro==='Todos'||p.tam===S.filtro)&&(!q||(p.titulo+' '+p.marca+' '+(p.descricao||'')).toLowerCase().includes(q))&&faixaOk(p.preco)&&(!S.fav||f.includes(p.id)));
if(S.ord==='menor')l=[...l].sort((a,b)=>a.preco-b.preco);else if(S.ord==='maior')l=[...l].sort((a,b)=>b.preco-a.preco);return l}
const card=p=>`<div class="card ${p.status==='vendida'?'sold':''}"><div class="ph" data-act="peca" data-v="${p.id}" style="cursor:pointer;position:relative">${p.foto_url?`<img src="${esc(p.foto_url)}" alt="${esc(p.titulo)}">`:'👗'}<button data-act="fav" data-v="${p.id}" aria-label="Favoritar" style="position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:99px">${favs().includes(p.id)?'♥':'♡'}</button></div><div class="cb"><b data-act="peca" data-v="${p.id}" style="cursor:pointer">${esc(p.titulo)}</b><span class="mut">Tam. ${esc(p.tam)} · ${esc(p.marca)} · ${esc(p.estado)}</span><b>${R(p.preco)}</b><span class="tag s-${p.status}">${LBL[p.status]}</span>${slug&&p.status==='disponivel'?`<button class="pri" data-act="reservar" data-v="${p.id}">Reservar</button>`:''}</div></div>`;
function listaHTML(){const l=filtrar();return `<p class="mut">${l.length} ${l.length===1?'peça':'peças'}</p><div class="grid">${l.map(card).join('')||'<p class="mut">Nenhuma peça com esses filtros.</p>'}</div>`}
function pecaView(){const p=S.pecas.find(x=>x.id===S.peca);if(!p)return `<p><button data-act="voltar">Voltar à loja</button></p><p class="mut">Peça não encontrada.</p>`;
const fs=p.fotos&&p.fotos.length?p.fotos:(p.foto_url?[p.foto_url]:[]),i=Math.min(S.foto||0,Math.max(0,fs.length-1));
const gal=fs.length?`<div class="ph" style="border-radius:14px"><img src="${esc(fs[i])}" alt="${esc(p.titulo)}"></div>${fs.length>1?`<div class="chips">${fs.map((u,k)=>`<img src="${esc(u)}" alt="" data-act="foto" data-v="${k}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid ${k===i?'var(--ac)':'transparent'}">`).join('')}</div>`:''}`:`<div class="ph" style="border-radius:14px">👗</div>`;
const sim=S.pecas.filter(x=>x.id!==p.id&&x.status==='disponivel'&&p.categoria&&x.categoria===p.categoria).slice(0,4),link=location.origin+location.pathname+'?b='+S.b.slug+'&peca='+p.id;
return `<p><button data-act="voltar">Voltar à loja</button></p><div style="max-width:520px">${gal}<h1 style="margin-top:12px">${esc(p.titulo)}</h1><b style="font-size:1.4rem">${R(p.preco)}</b> <span class="tag s-${p.status}">${LBL[p.status]}</span><p class="mut">Tam. ${esc(p.tam)} · ${esc(p.marca)} · ${esc(p.estado)}${p.categoria?' · '+esc(p.categoria):''}</p>${p.descricao?PL(p.descricao):''}${p.medidas?`<h2>Medidas</h2>${PL(p.medidas)}`:''}<p>${p.status==='disponivel'?`<button class="pri" data-act="reservar" data-v="${p.id}">Reservar</button> `:''}<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Olha essa peça: '+p.titulo+' '+link)}">Compartilhar no WhatsApp</a> <button data-act="fav" data-v="${p.id}">${favs().includes(p.id)?'♥ Favorita':'♡ Favoritar'}</button></p></div>${sim.length?`<h2>Peças parecidas</h2><div class="grid">${sim.map(card).join('')}</div>`:''}`}
function checklist(){const b=S.b,it=[['Logo da loja',!!b.logo_url,'loja'],['Capa da loja',!!b.capa_url,'loja'],['10 ou mais peças cadastradas',S.pecas.length>=10,'pecas'],['Regra de entrega e retirada',!!b.entrega_info,'loja'],['Contato completo (Instagram e retirada)',!!(b.instagram&&b.endereco),'loja'],['Avisos no Telegram',!!S.chat,'avisos']],n=it.filter(x=>x[1]).length;if(n===it.length)return '';
return `<h2>Complete sua loja (${n} de ${it.length})</h2><div style="height:8px;border-radius:99px;background:var(--bd);overflow:hidden"><div style="height:100%;width:${Math.round(n/it.length*100)}%;background:var(--ac)"></div></div>${it.map(([t,ok,ab])=>`<div class="box" style="margin-top:8px"><span>${ok?'✓':'○'} ${t}</span>${ok?'':`<button data-act="pab" data-v="${ab}">Completar</button>`}</div>`).join('')}`}
const TX='style="height:72px;font-size:1rem;word-break:normal"';
const PL=t=>`<p style="white-space:pre-line">${esc(t)}</p>`;
function aplicarCor(){const c=S.b&&S.b.cor,st=document.documentElement.style;if(/^#[0-9a-fA-F]{6}$/.test(c||'')){const L=.299*parseInt(c.slice(1,3),16)+.587*parseInt(c.slice(3,5),16)+.114*parseInt(c.slice(5,7),16);st.setProperty('--ac',c);st.setProperty('--acf',L>150?'#1b1714':'#fff')}}
function lojaView(){if(!S.b)return '<h1>Brechó não encontrado</h1><p class="mut">Confira o link.</p>';
const b=S.b,ds=[...new Set(S.pecas.map(p=>p.tam))],m=S.meu&&S.meu.status==='ativo'&&Date.parse(S.meu.expira_em)>Date.now();
const cab=`<div class="top" style="justify-content:flex-start;gap:14px">${b.logo_url?`<img src="${esc(b.logo_url)}" alt="" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:''}<div><h1>${esc(b.nome)}</h1><div class="mut">Peças únicas: reserve e pague por Pix</div></div></div>`;
const ban=m?`<div class="banner"><span>Reserva ativa: <b>${esc(S.meu.titulo)}</b> · expira em <b data-exp="${esc(S.meu.expira_em)}">${mmss(Date.parse(S.meu.expira_em)-Date.now())}</b></span><button class="pri" data-act="pedido">Ver Pix</button></div>`:'';
if(S.peca)return cab+ban+pecaView();
const abas=`<div class="tabs" style="flex-wrap:wrap;margin:14px 0">${[['produtos','Produtos'],['entrega','Entrega e pagamento'],['contato','Contato']].map(([k,t])=>`<button class="${S.aba===k?'on':''}" data-act="aba" data-v="${k}">${t}</button>`).join('')}</div>`;
const hero=`<div style="position:relative;border-radius:16px;overflow:hidden;margin:6px 0 14px;min-height:190px;display:flex;align-items:flex-end;background:var(--ac);color:var(--acf)">${b.capa_url?`<img src="${esc(b.capa_url)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`:''}<div style="position:relative;padding:18px;width:100%;${b.capa_url?'background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff':''}"><div style="font-size:1.35rem;font-weight:700">${esc(b.frase||'Peças únicas, escolhidas uma a uma')}</div><p style="margin:10px 0 0"><button data-act="aba" data-v="produtos">Ver peças</button></p></div></div>`;
const selos=`<div class="chips" style="margin-top:0">${['Peça única','Pix direto','Reserva de '+b.reserva_min+' min'].map(t=>`<span class="chip" style="border:1px solid var(--bd);background:var(--card);font-size:.85rem">✓ ${esc(t)}</span>`).join('')}</div>`;
const cats=CATS.filter(c=>S.pecas.some(p=>p.categoria===c[0])),sel=(id,v,o)=>`<select id="${id}">${o.map(([k,t])=>`<option value="${k}"${k===v?' selected':''}>${t}</option>`).join('')}</select>`;
const ctrl=`<input id="busca" placeholder="Buscar por nome, marca ou descrição" value="${esc(S.q||'')}"><div class="chips">${[['Todas','🛍️'],...cats].map(([n,i])=>`<button class="chip ${(S.cat||'Todas')===n?'on':''}" data-act="cat" data-v="${esc(n)}">${i} ${esc(n)}</button>`).join('')}</div><div class="chips">${['Todos',...ds].map(t=>`<button class="chip ${t===S.filtro?'on':''}" data-act="filtro" data-v="${esc(t)}">${t==='Todos'?'Todos os tamanhos':'Tam. '+esc(t)}</button>`).join('')}<button class="chip ${S.fav?'on':''}" data-act="favfiltro">♥ Favoritas</button></div><div class="row">${sel('faixa',S.faixa||'todas',[['todas','Qualquer preço'],['0-50','Até R$ 50'],['50-100','R$ 50 a 100'],['100-200','R$ 100 a 200'],['200+','Acima de R$ 200']])}${sel('ord',S.ord||'novas',[['novas','Mais novas'],['menor','Menor preço'],['maior','Maior preço']])}</div>`;
const disp=S.pecas.filter(p=>p.status==='disponivel'),semFiltro=!S.q&&(S.cat||'Todas')==='Todas'&&(S.faixa||'todas')==='todas'&&S.filtro==='Todos'&&!S.fav;
const cont={
produtos:()=>hero+(b.aviso?`<div class="banner" style="margin:0 0 12px;border-color:var(--ac)">${esc(b.aviso)}</div>`:'')+selos+(semFiltro&&disp.length>4?`<h2>Novidades</h2><div class="grid">${disp.slice(0,4).map(card).join('')}</div>`:'')+`<h2>Todas as peças (${disp.length} disponíveis)</h2>${ctrl}<div id="lista">${listaHTML()}</div>`,
entrega:()=>`<h2>Como funciona</h2><div class="box" style="display:block">1. Toque em Reservar na peça que você quer.<br>2. Pague o Pix em até ${b.reserva_min} minutos.<br>3. Avise o brechó no WhatsApp para confirmar.</div><h2>Entrega e retirada</h2>${b.entrega_info?PL(b.entrega_info):'<p>Combine com o brechó pelo WhatsApp.</p>'}<h2>Pagamento</h2><p>Pix direto para o brechó.</p>${b.trocas?`<h2>Trocas e devoluções</h2>${PL(b.trocas)}`:''}<h2>Perguntas frequentes</h2>${[['Posso reservar mais de uma peça?','Sim, até 2 reservas ao mesmo tempo, cada uma com o seu Pix.'],['E se eu não pagar a tempo?','A reserva expira em '+b.reserva_min+' minutos e a peça volta para a vitrine.'],['Como sei que o pagamento foi confirmado?','O brechó confere o Pix e confirma. Ao reabrir esta loja você vê “Pagamento confirmado”.'],['As peças são únicas?','Sim. Cada peça existe uma só vez, por isso reservar garante que ninguém leva antes.']].map(([q,a])=>`<details class="box" style="display:block;margin-bottom:8px"><summary><b>${q}</b></summary><p>${a}</p></details>`).join('')}`,
contato:()=>`<h2>Fale com o brechó</h2><p><a class="btn pri" href="https://wa.me/${esc(b.whats)}" target="_blank" rel="noopener">Chamar no WhatsApp</a></p>${b.instagram?`<p><a class="btn" href="https://instagram.com/${esc(b.instagram)}" target="_blank" rel="noopener">Instagram @${esc(b.instagram)}</a></p>`:''}${b.endereco?`<h2>Retirada</h2>${PL(b.endereco)}`:''}${b.horario?`<h2>Horário de atendimento</h2>${PL(b.horario)}`:''}${b.sobre?`<h2>Sobre o brechó</h2>${PL(b.sobre)}`:''}`};
return cab+ban+abas+cont[S.aba||'produtos']()}
function cfgFields(c,novo){return `<label>Nome do brechó</label><input name="nome" value="${esc(c.nome||'')}" required>${novo?`<label>Endereço do link (letras minúsculas, números e hífen)</label><input name="slug" pattern="[a-z0-9\\-]{3,40}" placeholder="meu-brecho" required>`:''}<div class="row"><div><label>WhatsApp (DDI e DDD)</label><input name="whats" value="${esc(c.whats||'55')}" inputmode="numeric" required></div><div><label>Minutos de reserva</label><input name="min" type="number" min="1" max="120" value="${c.reserva_min||30}" required></div></div><label>Chave Pix</label><input name="pix" value="${esc(c.pix||'')}" required><label>Cidade (para o Pix)</label><input name="cidade" value="${esc(c.cidade||'')}" required><label>Entrega e retirada (aparece na loja)</label><input name="entrega" value="${esc(c.entrega_info||'')}" placeholder="Ex.: retirada em Pinheiros ou envio combinado no WhatsApp">${novo?'':`<label>Instagram (sem @)</label><input name="instagram" maxlength="40" value="${esc(c.instagram||'')}"><label>Endereço ou ponto de retirada</label><textarea name="endereco" maxlength="300" ${TX}>${esc(c.endereco||'')}</textarea><label>Horário de atendimento</label><input name="horario" maxlength="120" value="${esc(c.horario||'')}" placeholder="Ex.: seg a sex, 10h às 18h"><label>Trocas e devoluções</label><textarea name="trocas" maxlength="500" ${TX}>${esc(c.trocas||'')}</textarea><label>Sobre o brechó</label><textarea name="sobre" maxlength="1000" ${TX}>${esc(c.sobre||'')}</textarea><label>Frase de destaque da capa</label><input name="frase" maxlength="120" value="${esc(c.frase||'')}" placeholder="Ex.: Moda circular com curadoria"><label>Aviso da loja (faixa no topo)</label><input name="aviso" maxlength="160" value="${esc(c.aviso||'')}" placeholder="Ex.: Frete grátis acima de R$ 150"><label>Foto de capa (opcional)</label><input name="capa" type="file" accept="image/*"><div class="row"><div><label>Cor da loja</label><input name="cor" type="color" value="${esc(c.cor||'#b4472f')}" style="height:42px;padding:3px"></div><div><label>Logo (opcional)</label><input name="logo" type="file" accept="image/*"></div></div>`}`}
function painelView(){
if(S.recup)return `<h1>Nova senha</h1><form data-form="novasenha"><label>Nova senha (mínimo 6 caracteres)</label><input name="senha" type="password" minlength="6" required><p><button class="pri">Salvar senha</button></p></form>`;
if(!S.user)return `<h1>Painel do brechó</h1><p class="mut">Entre com e-mail e senha, ou crie sua conta.</p><form data-form="login"><label>E-mail</label><input name="email" type="email" required><label>Senha (mínimo 6 caracteres)</label><input name="senha" type="password" minlength="6" required><p><button class="pri" value="entrar">Entrar</button> <button value="criar">Criar conta</button></p><p><button type="button" data-act="esqueci">Esqueci minha senha</button></p></form>`;
if(!S.b)return `<h1>Criar meu brechó</h1><form data-form="novo">${cfgFields({},true)}<p><button class="pri">Criar</button> <button type="button" data-act="sair">Sair</button></p></form>`;
const url=location.origin+location.pathname+'?b='+S.b.slug,st={ativo:'Aguardando pagamento',pago:'Pago',expirado:'Expirado',cancelado:'Cancelado'},at=S.pedidos.filter(o=>o.status==='ativo').length,ab=S.pab||'resumo';
const tabs=`<div class="tabs" style="flex-wrap:wrap;margin:14px 0">${[['resumo','Resumo'],['pedidos','Pedidos'+(at?' ('+at+')':'')],['pecas','Peças'],['loja','Loja'],['avisos','Avisos']].map(([k,t])=>`<button class="${ab===k?'on':''}" data-act="pab" data-v="${k}">${t}</button>`).join('')}</div>`;
const sec={
resumo:()=>`<div class="box"><span>Link da sua loja:<br><b>${esc(url)}</b></span><span><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir</a> <button data-act="link" data-v="${esc(url)}">Copiar</button></span></div>${resumo()}${checklist()}`,
pedidos:()=>S.pedidos.map(o=>`<div class="box"${o.status==='ativo'?' style="border-color:var(--wr)"':''}><span><b>${esc(o.pecas?o.pecas.titulo:'Peça removida')}</b><br><span class="mut">${esc(o.nome)} · ${esc(o.whats)}${o.entrega?' · '+esc(o.entrega):''} · ${st[o.status]}</span></span>${o.status==='ativo'?`<span><button class="pri" data-act="pago" data-v="${o.id}">Confirmar pagamento</button> <button data-act="cancelar" data-v="${o.id}">Cancelar</button></span>`:''}</div>`).join('')||'<p class="mut">Nenhum pedido ainda.</p>',
pecas:()=>`<h2>Nova peça</h2><form data-form="peca"><label>Título</label><input name="titulo" required><div class="row"><div><label>Tamanho</label><input name="tam" required></div><div><label>Marca</label><input name="marca"></div></div><div class="row"><div><label>Estado</label><select name="estado"><option>Ótimo</option><option>Bom</option><option>Com detalhe</option></select></div><div><label>Preço (R$)</label><input name="preco" type="number" step="0.01" min="1" required></div></div><label>Categoria</label><select name="categoria">${CATS.map(c=>`<option>${c[0]}</option>`).join('')}</select><label>Descrição (opcional)</label><textarea name="descricao" maxlength="1000" ${TX}></textarea><label>Medidas (opcional)</label><input name="medidas" maxlength="300" placeholder="Ex.: busto 90 cm, comprimento 105 cm"><label>Fotos (até 5)</label><input name="foto" type="file" accept="image/*" multiple><p><button class="pri">Adicionar peça</button></p></form><h2>Minhas peças</h2>${S.pecas.map(p=>`<div class="box"><span>${esc(p.titulo)} · ${R(p.preco)} · <span class="s-${p.status}">${LBL[p.status]}</span></span><span>${p.status!=='reservada'?`<button data-act="editar" data-v="${p.id}">Editar</button> `:''}${p.status==='disponivel'?`<button data-act="vendida" data-v="${p.id}">Vendida fora do site</button> <button data-act="remover" data-v="${p.id}">Remover</button>`:''}${p.status==='vendida'?`<button data-act="disponibilizar" data-v="${p.id}">Voltar à venda</button>`:''}</span></div>`).join('')}`,
loja:()=>`<form data-form="cfg">${cfgFields(S.b,false)}<p><button class="pri">Salvar</button></p></form>`,
avisos:()=>`<h2>Avisos no Telegram</h2><p class="mut">Receba uma mensagem a cada nova reserva. 1) ${BOT_USER.startsWith('COLE')?'Abra o bot do sistema':`<a href="https://t.me/${esc(BOT_USER)}" target="_blank" rel="noopener">Abra o bot</a>`} e toque em Iniciar. 2) No Telegram, procure @userinfobot, toque em Iniciar e copie o número do seu Id. 3) Cole o número abaixo.</p><form data-form="aviso"><label>Seu Id do Telegram</label><input name="chat" inputmode="numeric" value="${esc(S.chat||'')}" required><p><button class="pri">Salvar</button> <button type="button" data-act="testeaviso">Enviar teste</button></p></form>`};
return `<div class="top"><h1>${esc(S.b.nome)}</h1><button data-act="sair">Sair</button></div>${tabs}${sec[ab]()}`}
function modalHTML(){let h;const m=S.modal;
if(m.t==='reservar'){const p=S.pecas.find(x=>x.id===m.id);h=`<h2>Reservar: ${esc(p.titulo)}</h2><p class="mut">${R(p.preco)} · a peça fica reservada por ${S.b.reserva_min} min.</p><form data-form="reserva"><label>Seu nome</label><input name="nome" required><label>Seu WhatsApp</label><input name="whats" inputmode="tel" required><label>Como prefere receber?</label><select name="entrega"><option>Retirada</option><option>Envio</option></select>${S.b.entrega_info?`<p class="mut">${esc(S.b.entrega_info)}</p>`:''}<p><button class="pri" style="width:100%">Reservar e ver Pix</button></p></form>`}
else if(m.t==='editar'){const p=S.pecas.find(x=>x.id===m.id);h=`<h2>Editar peça</h2><form data-form="editar"><label>Título</label><input name="titulo" value="${esc(p.titulo)}" required><div class="row"><div><label>Tamanho</label><input name="tam" value="${esc(p.tam)}" required></div><div><label>Marca</label><input name="marca" value="${esc(p.marca)}"></div></div><div class="row"><div><label>Estado</label><select name="estado">${['Ótimo','Bom','Com detalhe'].map(x=>`<option${x===p.estado?' selected':''}>${x}</option>`).join('')}</select></div><div><label>Preço (R$)</label><input name="preco" type="number" step="0.01" min="1" value="${p.preco}" required></div></div><label>Categoria</label><select name="categoria">${CATS.map(c=>`<option${c[0]===p.categoria?' selected':''}>${c[0]}</option>`).join('')}</select><label>Descrição</label><textarea name="descricao" maxlength="1000" ${TX}>${esc(p.descricao||'')}</textarea><label>Medidas</label><input name="medidas" maxlength="300" value="${esc(p.medidas||'')}"><p><button class="pri" style="width:100%">Salvar alterações</button></p></form>`}
else{const o=S.meu;if(o.status==='ativo'){const code=pix(S.b.pix,o.preco,S.b.nome,S.b.cidade),msg=`Oi! Reservei “${o.titulo}” (${R(o.preco)}) e já fiz o Pix. Prefiro: ${o.entrega||'combinar'}.`;
h=`<h2>Pague por Pix: ${R(o.preco)}</h2><p>Reserva de <b>${esc(o.titulo)}</b> expira em <b data-exp="${esc(o.expira_em)}">${mmss(Date.parse(o.expira_em)-Date.now())}</b>.</p><div class="qr" id="qr"></div><textarea id="pixtxt" readonly>${code}</textarea><p><button class="pri" data-act="copiar" style="width:100%">Copiar Pix copia e cola</button></p><p><a class="btn" style="width:100%;text-align:center" target="_blank" rel="noopener" href="https://wa.me/${esc(S.b.whats)}?text=${encodeURIComponent(msg)}">Já paguei: avisar no WhatsApp</a></p>`}
else h=`<h2>${o.status==='pago'?'Pagamento confirmado!':'Reserva '+(o.status==='expirado'?'expirada':'cancelada')}</h2><p class="mut">${o.status==='pago'?'Obrigado! O brechó vai combinar a entrega.':'A peça voltou para a loja.'}</p>`}
return `<div class="ov" data-act="fechar"><div class="md">${h}<p><button data-act="fechar" style="width:100%">Fechar</button></p></div></div>`}
function drawQR(){const el=$('#qr');if(!el||!window.QRCode)return;try{new QRCode(el,{text:$('#pixtxt').value,width:176,height:176,correctLevel:QRCode.CorrectLevel.L})}catch(e){}}
function render(){aplicarCor();if(slug&&S.b)document.title=S.b.nome;$('#app').innerHTML=(pag?paginaView():slug?lojaView():painelView())+RODAPE+(S.modal&&S.b?modalHTML():'');if(S.modal&&S.modal.t==='pedido'&&S.meu&&S.meu.status==='ativo')drawQR()}

document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b||!db)return;const a=b.dataset.act,v=b.dataset.v;
if(a==='fechar'&&b.classList.contains('ov')&&e.target!==b)return;
if(a==='filtro')S.filtro=v;
else if(a==='reservar')S.modal={t:'reservar',id:v};
else if(a==='pedido')S.modal={t:'pedido'};
else if(a==='fechar')S.modal=null;
else if(a==='copiar'||a==='link'){const t=a==='link'?v:$('#pixtxt').value;try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(_){toast('Não foi possível copiar')}return}
else if(a==='pago'||a==='cancelar'){const {error}=await db.rpc('resolver_pedido',{p_id:v,p_acao:a==='pago'?'pago':'cancelar'});if(error)toast('Não foi possível atualizar o pedido');return refresh()}
else if(a==='remover'){await db.from('pecas').delete().eq('id',v);return refresh()}
else if(a==='aba'){S.aba=v;S.peca=null;history.replaceState(null,'','?b='+slug+'#'+v)}
else if(a==='cat')S.cat=v;
else if(a==='favfiltro')S.fav=!S.fav;
else if(a==='fav'){const f=favs(),k=f.indexOf(v);if(k<0)f.push(v);else f.splice(k,1);try{localStorage.setItem('fav:'+slug,JSON.stringify(f))}catch(_){}}
else if(a==='peca'){S.peca=v;S.foto=0;history.replaceState(null,'','?b='+slug+'&peca='+v);scrollTo(0,0)}
else if(a==='voltar'){S.peca=null;history.replaceState(null,'','?b='+slug+'#'+(S.aba||'produtos'))}
else if(a==='foto')S.foto=+v;
else if(a==='pab')S.pab=v;
else if(a==='editar')S.modal={t:'editar',id:v};
else if(a==='vendida'||a==='disponibilizar'){const {error}=await db.rpc('marcar_peca',{p_id:v,p_status:a==='vendida'?'vendida':'disponivel'});if(error)toast('Erro: '+error.message);return refresh()}
else if(a==='esqueci'){const em=(document.querySelector('input[name=email]')||{}).value;if(!em)return toast('Digite seu e-mail primeiro');const {error}=await db.auth.resetPasswordForEmail(em.trim(),{redirectTo:location.href.split('#')[0]});toast(error?'Erro: '+error.message:'Enviamos um link para redefinir a senha');return}
else if(a==='testeaviso'){const {error}=await db.rpc('testar_aviso');toast(error?'Erro: '+error.message:'Teste enviado: confira o Telegram');return}
else if(a==='sair'){await db.auth.signOut();S.user=null;S.b=null}
render()});
document.addEventListener('submit',async e=>{e.preventDefault();if(!db)return;const f=e.target,d=Object.fromEntries(new FormData(f)),k=f.dataset.form;
if(k==='login'){const modo=e.submitter&&e.submitter.value,cred={email:d.email.trim(),password:d.senha};const r=modo==='criar'?await db.auth.signUp(cred):await db.auth.signInWithPassword(cred);
if(r.error)return toast('Erro: '+r.error.message);
if(modo==='criar'&&!r.data.session)return toast('Conta criada, mas o Supabase ainda exige confirmação por e-mail (veja o LEIA-ME).');
return refresh()}
if(k==='novo'||k==='cfg'){const row={nome:d.nome.trim(),whats:d.whats.replace(/\D/g,''),pix:d.pix.trim(),cidade:d.cidade.trim(),entrega_info:(d.entrega||'').trim(),reserva_min:Math.min(120,Math.max(1,+d.min||30))};
if(k==='cfg'){const t=(x,n)=>(x||'').trim().slice(0,n);Object.assign(row,{instagram:t(d.instagram,40).replace(/^@/,'').replace(/[^A-Za-z0-9._]/g,''),endereco:t(d.endereco,300),horario:t(d.horario,120),trocas:t(d.trocas,500),sobre:t(d.sobre,1000),frase:t(d.frase,120),aviso:t(d.aviso,160),cor:/^#[0-9a-fA-F]{6}$/.test(d.cor||'')?d.cor:null});
if(d.logo&&d.logo.size){const blob=await comprimir(d.logo);if(blob){const path=S.user.id+'/logo-'+Date.now()+'.jpg',up=await db.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(!up.error)row.logo_url=db.storage.from('fotos').getPublicUrl(path).data.publicUrl}}
if(d.capa&&d.capa.size){const blob=await comprimir(d.capa,1600);if(blob){const path=S.user.id+'/capa-'+Date.now()+'.jpg',up=await db.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(!up.error)row.capa_url=db.storage.from('fotos').getPublicUrl(path).data.publicUrl}}}
const r=k==='novo'?await db.from('brechos').insert({...row,owner:S.user.id,slug:d.slug.trim().toLowerCase()}):await db.from('brechos').update(row).eq('id',S.b.id);
toast(r.error?'Não foi possível salvar (o endereço do link pode já existir)':'Salvo');return refresh()}
if(k==='aviso'){const {error}=await db.from('avisos').upsert({brecho_id:S.b.id,telegram_chat_id:d.chat.trim()});toast(error?'Não foi possível salvar: '+error.message:'Salvo. Clique em Enviar teste.');return refresh()}
if(k==='novasenha'){const {error}=await db.auth.updateUser({password:d.senha});if(error)return toast('Erro: '+error.message);S.recup=false;toast('Senha alterada');return refresh()}
if(k==='editar'){const {error}=await db.rpc('editar_peca',{p_id:S.modal.id,p_titulo:d.titulo,p_tam:d.tam,p_marca:d.marca||'Sem marca',p_estado:d.estado,p_preco:+d.preco,p_categoria:d.categoria,p_descricao:(d.descricao||'').trim().slice(0,1000),p_medidas:(d.medidas||'').trim().slice(0,300)});toast(error?'Erro: '+error.message:'Peça atualizada');S.modal=null;return refresh()}
if(k==='peca'){toast('Salvando…');const fs=new FormData(f).getAll('foto').filter(x=>x&&x.size).slice(0,5),urls=[];for(const fl of fs){const blob=await comprimir(fl);if(!blob)continue;const path=S.user.id+'/'+Date.now()+'-'+urls.length+'.jpg',up=await db.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(!up.error)urls.push(db.storage.from('fotos').getPublicUrl(path).data.publicUrl)}
const {error}=await db.from('pecas').insert({brecho_id:S.b.id,titulo:d.titulo.trim(),tam:d.tam.trim(),marca:d.marca.trim()||'Sem marca',estado:d.estado,preco:+d.preco,categoria:d.categoria,descricao:(d.descricao||'').trim().slice(0,1000)||null,medidas:(d.medidas||'').trim().slice(0,300)||null,foto_url:urls[0]||null,fotos:urls});toast(error?'Não foi possível adicionar: '+error.message:'Peça adicionada');return refresh()}
if(k==='reserva'){const p=S.pecas.find(x=>x.id===S.modal.id);const {data,error}=await db.rpc('reservar_peca',{p_peca:p.id,p_nome:d.nome,p_whats:d.whats,p_entrega:d.entrega});
if(error){toast('Não foi possível reservar: a peça pode ter acabado de ser reservada.');S.modal=null}
else{S.meu={id:data.id,titulo:p.titulo,preco:p.preco,status:'ativo',expira_em:data.expira_em,entrega:d.entrega};saveMeu();S.modal={t:'pedido'}}
return refresh()}});
document.addEventListener('input',e=>{if(e.target.id==='busca'){S.q=e.target.value;$('#lista').innerHTML=listaHTML()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='faixa'||t.id==='ord'){S[t.id==='faixa'?'faixa':'ord']=t.value;$('#lista').innerHTML=listaHTML()}});
let ult=null;
function bip(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function avisoPainel(){const n=S.pedidos.filter(o=>o.status==='ativo').length;if(ult!==null&&n>ult){bip();toast('Nova reserva!')}ult=n;document.title=n?'('+n+') Brechó':'Brechó'}
setInterval(async()=>{if(!db||slug||pag||!S.user||!S.b||S.modal)return;await loadPainel();avisoPainel();const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()},15000);
setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>el.textContent=mmss(Date.parse(el.dataset.exp)-Date.now())),1000);
setInterval(async()=>{if(db&&slug&&S.b&&!(S.modal&&S.modal.t==='reservar')&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))await refresh()},15000);
(async()=>{if(SUPABASE_URL.startsWith('COLE')){$('#app').innerHTML='<h2>Falta configurar</h2><p>Cole a URL e a chave do Supabase no topo do arquivo index.html (veja o LEIA-ME).</p>';return}
{const h=location.hash.slice(1);S.aba=['entrega','contato'].includes(h)?h:'produtos';S.peca=new URLSearchParams(location.search).get('peca')}db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);db.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.recup=true;render();return}if(!slug&&(ev==='SIGNED_IN'||ev==='SIGNED_OUT'))refresh()});await refresh()})();
</script>
