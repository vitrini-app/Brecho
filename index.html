<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--fg:#2a2420;--mut:#7a6e65;--card:#fff;--bd:#e6ddd2;--ac:#b4472f;--acf:#fff;--ok:#2f7d55;--wr:#a8741a;color-scheme:light}

*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:22px 0 8px}
.mut{color:var(--mut);font-size:.9rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;text-decoration:none;display:inline-block}
.pri{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.chip{padding:5px 12px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:3rem;background:var(--bd);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:contain;object-position:center}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.cb button{margin-top:auto;width:100%}
.tag{font-size:.78rem;font-weight:600}
.s-disponivel{color:var(--ok)}.s-reservada{color:var(--wr)}.s-vendida{color:var(--mut)}.sold{opacity:.55}
.banner{background:var(--card);border:1px solid var(--wr);border-radius:12px;padding:10px 14px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.md{background:var(--bg);border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:92vh;overflow:auto}
label{display:block;font-size:.88rem;margin:10px 0 3px}
input,select,textarea{font:inherit;width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--fg)}
textarea{height:84px;font-size:.75rem;word-break:break-all}
.row{display:flex;gap:8px}.row>*{flex:1}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;margin:10px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
</style>
</head>

function comprimir(f,mx=900){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.8)};i.onerror=()=>r(null);i.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)})}

if(k==='novasenha'){const {error}=await db.auth.updateUser({password:d.senha});if(error)return toast('Erro: '+error.message);S.recup=false;toast('Senha alterada');return refresh()}
if(k==='editar'){const {error}=await db.rpc('editar_peca',{p_id:S.modal.id,p_titulo:d.titulo,p_tam:d.tam,p_marca:d.marca||'Sem marca',p_estado:d.estado,p_preco:+d.preco,p_categoria:d.categoria,p_descricao:(d.descricao||'').trim().slice(0,1000),p_medidas:(d.medidas||'').trim().slice(0,300)});toast(error?'Erro: '+error.message:'Peça atualizada');S.modal=null;return refresh()}
if(k==='peca'){toast('Salvando…');const fs=new FormData(f).getAll('foto').filter(x=>x&&x.size).slice(0,5),urls=[];for(const fl of fs){const blob=await comprimir(fl);if(!blob)continue;const path=S.user.id+'/'+Date.now()+'-'+urls.length+'.jpg',up=await db.storage.from('fotos').upload(path,blob,{contentType:'image/jpeg'});if(!up.error)urls.push(db.storage.from('fotos').getPublicUrl(path).data.publicUrl)}
const {error}=await db.from('pecas').insert({brecho_id:S.b.id,titulo:d.titulo.trim(),tam:d.tam.trim(),marca:d.marca.trim()||'Sem marca',estado:d.estado,preco:+d.preco,categoria:d.categoria,descricao:(d.descricao||'').trim().slice(0,1000)||null,medidas:(d.medidas||'').trim().slice(0,300)||null,foto_url:urls[0]||null,fotos:urls});toast(error?'Não foi possível adicionar: '+error.message:'Peça adicionada');return refresh()}
if(k==='reserva'){const p=S.pecas.find(x=>x.id===S.modal.id);const {data,error}=await db.rpc('reservar_peca',{p_peca:p.id,p_nome:d.nome,p_whats:d.whats,p_metodo:d.metodo,p_slot:d.slot||null,p_bairro:d.bairro||null,p_uf:d.uf||null,p_cep:d.cep||null,p_endereco:d.endereco||null,p_pagamento:d.pagamento||'pix'});
if(error){toast(ERR[error.message]||'Não foi possível reservar');S.modal=null}
else{S.meu={id:data.id,titulo:p.titulo,preco:p.preco,status:'ativo',expira_em:data.expira_em};await checkMeu();saveMeu();S.modal={t:'pedido'}}
return refresh()}});
document.addEventListener('input',e=>{if(e.target.id==='busca'){S.q=e.target.value;$('#lista').innerHTML=listaHTML()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='faixa'||t.id==='ord'){S[t.id==='faixa'?'faixa':'ord']=t.value;$('#lista').innerHTML=listaHTML()}});
const reduz=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('mouseover',e=>{S.pausa=!!e.target.closest('.car')});
function girar(k){const ss=document.querySelectorAll('.car .sl'),ds=document.querySelectorAll('.car .dot');if(!ss.length)return;S.slide=(k+ss.length)%ss.length;ss.forEach((el,i)=>el.style.opacity=i===S.slide?1:0);ds.forEach((d,i)=>d.style.background=i===S.slide?'#fff':'rgba(255,255,255,.5)')}
setInterval(()=>{if(!reduz&&!S.pausa&&!document.hidden&&document.querySelector('.car'))girar((S.slide||0)+1)},4000);
document.addEventListener('change',e=>{const t=e.target;if(t.name==='categoria'&&t.form){const b=t.form.querySelector('.tamcampo');if(b)b.innerHTML=tamCampo(t.value,'')}});
document.addEventListener('change',e=>{const f=e.target.form;if(f&&f.dataset.form==='reserva'){if(e.target.name==='metodo')$('#campos').innerHTML=camposEnt(e.target.value);fretePrev()}});
document.addEventListener('input',e=>{const f=e.target.form;if(f&&f.dataset.form==='reserva'&&e.target.name==='bairro')fretePrev()});
let ult=null;
function bip(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(e){}}
function avisoPainel(){const n=S.pedidos.filter(o=>o.status==='ativo').length;if(ult!==null&&n>ult){bip();toast('Nova reserva!')}ult=n;document.title=n?'('+n+') Brechó':'Brechó'}
setInterval(async()=>{if(!db||slug||pag||!S.user||!S.b||S.modal)return;await loadPainel();avisoPainel();const a=document.activeElement;if(!a||!/INPUT|SELECT|TEXTAREA/.test(a.tagName))render()},15000);
setInterval(()=>document.querySelectorAll('[data-exp]').forEach(el=>el.textContent=mmss(Date.parse(el.dataset.exp)-Date.now())),1000);
setInterval(async()=>{if(db&&slug&&S.b&&!(S.modal&&['reservar','recebi'].includes(S.modal.t))&&!(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)))await refresh()},15000);
(async()=>{if(SUPABASE_URL.startsWith('COLE')){$('#app').innerHTML='<h2>Falta configurar</h2><p>Cole a URL e a chave do Supabase no topo do arquivo index.html (veja o LEIA-ME).</p>';return}
{const h=location.hash.slice(1);S.aba=['entrega','contato'].includes(h)?h:'produtos';S.peca=new URLSearchParams(location.search).get('peca');S.ped=!!new URLSearchParams(location.search).get('pedido')}db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);db.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.recup=true;render();return}if(!slug&&(ev==='SIGNED_IN'||ev==='SIGNED_OUT'))refresh()});await refresh()})();
</script>
